name: Twitch check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub's minimum; runs can lag a few minutes)
  workflow_dispatch:         # adds a "Run workflow" button for testing

permissions:
  contents: write            # lets the job save seen.json back to the repo

concurrency: twitch-check    # never run two checks at once

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node check.js
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_GAME_ID: ${{ secrets.TWITCH_GAME_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Save who's live
        run: |
          git config user.name "twitch-bot"
          git config user.email "twitch-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update live list" && git push)
